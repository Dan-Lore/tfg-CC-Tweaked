# TerraFirmaGreg + CC:Tweaked recipe list
# One recipe per line. Fields separated by |
#
# Format:
#   machine | inputs | outputs | flag
#
# machine:
#   tfg:<tier>_<kind>_<circuit>
#   Examples: tfg:hv_food_oven_0, tfg:hv_food_processor_3, tfg:hv_electric_greenhouse_0
#
# inputs / outputs:
#   - or null                  = none
#   id count                   = item stack (count is items)
#   id countmb                 = fluid stack (count is millibuckets)
#   Multiple stacks: comma-separated
#
# flag:
#   grow        = electric greenhouse (handled by greenhouse.lua)
#   craft       = crafting-table style (reserved)
#   processing  = food_oven / food_processor (handled by craft.lua)
#
# Tags (#namespace:path) are allowed where the pack accepts them.

# --- Grow (electric greenhouse) ---
tfg:hv_electric_greenhouse_0 | - | tfc:food/wheat 20 | grow
