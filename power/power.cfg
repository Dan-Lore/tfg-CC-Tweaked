# power.cfg — copy next to power.lua on the computer
#
# monitor | <side or peripheral name>     # default: left (right used by ae_stats display)
# text_scale | auto | <0.5..5 step 0.5>  # auto = largest scale that fits UI
# substation | <peripheral name>          # optional pin; else *power_substation*
# turbine_substr | <needle>               # default: gas_large_turbine
# engine_substr | <needle>                # default: extreme_combustion_engine
# substation_substr | <needle>            # default: power_substation
#
# threshold_low | 0.60
# threshold_high | 0.90
# threshold_critical | 0.95
# threshold_warn | 0.75
# threshold_emergency | 0.40
# ramp_speed_pct | 60
# drain_override_eut | -4000             # net EU/t; overrides ramp hold
# cooldown | 20
# measure_interval | 5
# boot_wait | 120
# rotor_warn_pct | 20                    # yellow durability warning on monitor

monitor | left
text_scale | auto

# substation | gtceu:power_substation_0
turbine_substr | gas_large_turbine
engine_substr | extreme_combustion_engine
substation_substr | power_substation

threshold_low | 0.60
threshold_high | 0.90
threshold_critical | 0.95
threshold_warn | 0.75
threshold_emergency | 0.40
ramp_speed_pct | 60
drain_override_eut | -4000
cooldown | 20
measure_interval | 5
boot_wait | 120
rotor_warn_pct | 20
