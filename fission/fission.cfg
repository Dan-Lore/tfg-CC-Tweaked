# fission.cfg — copy next to fission.lua on the computer
#
# Two Dea's Fission reactors. Script feeds allow-listed rods only (crates are
# pull-only). Everything leaving output buses / wrong items on input buses
# goes to AE. Never deposit into stock crates.
#
# monitor   | <side|peripheral>     # default: right
# ae        | <peripheral>          # depleted + rejected items
# poll      | <seconds>             # loop interval (default: 1)
# rod_cap   | <n>                   # max rods per reactor (default: 5)
# text_scale| <0.5..5>              # размер шрифта монитора (шаг 0.5; default: 0.5)
#                                 # aliases: scale | font | font_scale
#
# fuel | <item id> | <heat rating>
# reactor | <label> | <controller> | <input_bus> | <output_bus> | <stock> | <allow item>[,...]
# First allow item is the primary fuel for target-N display.

monitor | right
ae | ae2:interface_0
poll | 1
rod_cap | 5
text_scale | 0.5

fuel | tfg:thorium_rod | 0.7
fuel | tfg:uranium_rod | 2.2
fuel | tfg:plutonium_rod | 3.0
fuel | tfg:tbu_232_rod | 2.0
fuel | tfg:americium_241_rod | 0.5
fuel | tfg:neptunium_237_rod | 2.0
fuel | tfg:californium_252_rod | 4.0

reactor | Торий | fission_reactor_0 | gtceu:hv_input_bus_0 | gtceu:hv_output_bus_0 | gtceu:wood_crate_2 | tfg:thorium_rod
reactor | Уран | fission_reactor_1 | gtceu:hv_input_bus_1 | gtceu:hv_output_bus_1 | gtceu:wood_crate_3 | tfg:uranium_rod
