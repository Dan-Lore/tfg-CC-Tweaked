# distill.cfg — copy next to distill.lua on the computer
#
# tower | <peripheral name>               # optional pin; else *tower_substr*
# tower_substr | <needle>                 # default: distillation_tower
# tank_substr | <needle>                  # default: super_tank
# tank_also | <needle>                    # also match quantum_tank (empty = off)
# monitor | <side or peripheral name>     # default: top
#
# threshold_low | 0.12                    # flat band fallback
# threshold_high | 0.18
# smart_maintain | true                   # cycles × recipe_out / capacity
# cycles_low | 100                        # ON if any tank below this many cycles
# cycles_high | 160                       # OFF when every tank has at least this
# min_ratio | 0.08                        # floor for smart %
# max_ratio | 0.30                        # ceil for smart %
# hyst_min | 0.05                         # highTh >= lowTh + this
#
# cooldown | 90                           # seconds after OFF before re-enable
# min_run | 110                           # stay ON at least this long once started
# emergency_frac | 0.40                   # ignore cooldown if ratio < lowTh * this
#
# poll | 2
# boot_wait | 120
# boot_poll | 2
# tier_base_mb | 4000000                  # GT Super/Quantum tank base (ULV)
#
# recipe_output | <fluid_suffix> | <mB>   # mB per distillation cycle
# fluid_ratio | <fluid_suffix> | <low> | <high>
# tank_index_ratio | <index> | <low> | <high>

tower | gtceu:distillation_tower_0
tower_substr | distillation_tower
tank_substr | super_tank
tank_also | quantum_tank
monitor | top

threshold_low | 0.12
threshold_high | 0.18
smart_maintain | true
cycles_low | 100
cycles_high | 160
min_ratio | 0.08
max_ratio | 0.30
hyst_min | 0.05

cooldown | 90
min_run | 110
emergency_frac | 0.40

poll | 2
boot_wait | 120
boot_poll | 2
tier_base_mb | 4000000

recipe_output | carbon_dioxide | 80000
recipe_output | nitrogen | 7000
recipe_output | argon | 5000
recipe_output | oxygen | 3000
recipe_output | krypton | 1000
recipe_output | neon | 1000
recipe_output | xenon | 1000

fluid_ratio | krypton | 0.015 | 0.02
fluid_ratio | neon | 0.015 | 0.02
fluid_ratio | xenon | 0.015 | 0.02
