# ebf.cfg — copy next to ebf.lua on the computer
#
# Feeds atomic recipes from HV buffers into EBF hatch sets, drains outputs.
# Does not start/stop blast furnaces.
#
# recipe_buffer_prefix | gtceu:hv_buffer   # recipe sources; index >= recipe_buffer_min
# recipe_buffer_min | 1                    # skip hv_buffer_0 (hot-ingot sink)
# hot_sink | gtceu:hv_buffer_0             # hot_*_ingot destination
# ae_sink | ae2:pattern_provider_5         # everything else from output bus/hatch
# monitor | top                            # 2-high × 1-wide monitor above computer
#
# input_bus_prefix | gtceu:lv_input_bus
# input_hatch_prefix | gtceu:ev_input_hatch_4x
# output_bus_prefix | gtceu:lv_output_bus
# output_hatch_prefix | gtceu:lv_output_hatch
#
# max_inflight | 8                         # per hatch pack = pair NL+NR (2 craft + buffer)
# items_per_recipe | 1                     # Al dust units per recipe; batched into one push
# fluid_per_recipe | 0                     # 0 = scale fluid with item split; or set e.g. 1000
# skip_fluids | false                      # unused on push (tanks always read for N2)
# poll | 0                                 # busy: sleep(0); idle: ≥0.05s
# hot_per_recipe | 1
# craft_grace | 8                          # clear sticky feed limit after idle (empty I/O)
# max_furnaces | 0

recipe_buffer_prefix | gtceu:hv_buffer
recipe_buffer_min | 1
hot_sink | gtceu:hv_buffer_0
ae_sink | ae2:pattern_provider_5
monitor | top

input_bus_prefix | gtceu:lv_input_bus
input_hatch_prefix | gtceu:ev_input_hatch_4x
output_bus_prefix | gtceu:lv_output_bus
output_hatch_prefix | gtceu:lv_output_hatch

max_inflight | 8
items_per_recipe | 1
fluid_per_recipe | 0
skip_fluids | false
poll | 0
hot_per_recipe | 1
craft_grace | 8
max_furnaces | 0
