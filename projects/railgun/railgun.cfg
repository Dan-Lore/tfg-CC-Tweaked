# railgun.cfg — copy next to railgun.lua on the computer
#
# One Sender, 10 HV input loaders on a wired modem. When every loader has no
# empty slots, wait settle seconds (stacks can top up), pulse relay back face
# into the railgun, then cooldown.
#
# loader_prefix | <name prefix>   # default: tfg:hv_railgun_item_loader_in
# expected      | <count>         # wait until this many loaders exist (default 10)
# relay         | <peripheral>    # default: top
# relay_side    | <side|all>      # default: back (computer-facing back of relay)
# settle        | <seconds>       # hold all-full before pulse (default: 15)
# pulse         | <seconds>       # signal on duration (default: 3)
# poll          | <seconds>       # check interval (default: 2)
# cooldown      | <seconds>       # after pulse (default: 120)

loader_prefix | tfg:hv_railgun_item_loader_in
expected | 10
relay | top
relay_side | back
settle | 15
pulse | 3
poll | 2
cooldown | 120
