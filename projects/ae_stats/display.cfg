# display.cfg — copy next to display.lua on the power computer
# Also copy labels.cfg next to this file.
#
# monitor | <side or name>       # default: right
# modem | <side>                 # default: top
# text_scale | auto | <0.5..5>
# host_id | <sampler computer id>  # optional
# graph_id | <graphview computer id>  # optional; else lookup ae_stats_graph
# refresh_interval | <seconds>   # auto-reload list; 0=off; default: 5
#
# Multishell: keep the display tab focused so monitor touches are delivered.

monitor | right
modem | top
text_scale | auto
refresh_interval | 5
