# sampler.cfg — copy next to sampler.lua on the ME computer
#
# modem | <side>                 # default: top
# bridge | <side or name>        # default: bottom (meBridge)
# sample_interval | <seconds>    # full AE snapshot period; default: 30
# retain_hours | <hours>         # history keep; default: 2.5
# persist_every | <seconds>      # disk flush; default: 60
# max_series | <n>               # cap distinct item/fluid series (LRU); default: 512
#
# Sampler writes a point for EVERY item and fluid in AE each interval.
# Open a graph anytime — history is already on disk (after the first sample).
# max_series bounds CC disk/RAM when AE is huge (oldest-touched keys drop first).

modem | top
bridge | bottom
sample_interval | 30
retain_hours | 2.5
persist_every | 60
max_series | 512
