# graphview.cfg — copy next to graphview.lua on the graph computer
# Also copy labels.cfg next to this file.
#
# monitor | <side or name>       # default: right
# modem | <side>                 # default: top
# text_scale | auto | <0.5..5>   # auto = 0.5 (max resolution for charts)
# host_id | <sampler computer id>  # optional; else rednet.lookup
# window | 5m|10m|30m|1h|2h
# step | 1m|5m|10m|30m
# interp | off|i1|i2
# refresh_interval | <seconds>   # 0=off; default: 5
#
# Multishell: keep this tab focused for monitor touch.

monitor | right
modem | top
text_scale | auto
window | 30m
step | 5m
interp | i1
refresh_interval | 5
