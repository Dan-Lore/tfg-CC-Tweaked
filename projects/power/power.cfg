# power.cfg — copy next to power.lua on the computer
#
# monitor | <side or peripheral name>     # default: left (right used by ae_stats display)
# text_scale | auto | <0.5..5 step 0.5>  # auto = largest scale that fits UI
# substation | <peripheral name>          # optional pin; else *power_substation*
# turbine_substr | <needle>               # default: gas_large_turbine
# engine_substr | <needle>                # default: extreme_combustion_engine
# substation_substr | <needle>            # default: power_substation
#
# threshold_low | 0.60                    # вход в режим заполнения
# threshold_high | 0.90                   # с этого % гасим турбины (инерция/кд)
# threshold_critical | 0.95
# threshold_warn | 0.75
# threshold_emergency | 0.40
# engine_target | 0.95                   # выход из заполнения / цель догона ДГ
# turbine_rated_eut | 9012               # EU/t одной турбины (для гистерезиса)
# turbine_diff_mult | 2                  # шаг турбин только если |net| > rated*mult
# ramp_speed_pct | 60
# drain_override_eut | -4000             # глубже → ДГ на скачок (+ override ramp)
# spike_clear_eut | 0                    # (compat, unused)
# fill_enable_cooldown | 2               # пауза между включениями турбин в fill
# cooldown | 20                          # пауза после турбин (maintain)
# engine_cooldown | 2                    # пауза после включения ДГ
# engine_off_cooldown | 15               # пауза после выключения ДГ (анти-тырк)
# measure_interval | 5
# boot_wait | 120
# rotor_warn_pct | 20                    # yellow durability warning on monitor
# engine_rated_eut | 32768               # EU/t while recipe mid-cycle (LuV extreme CE)

monitor | left
text_scale | auto

# substation | gtceu:power_substation_0
turbine_substr | gas_large_turbine
engine_substr | extreme_combustion_engine
substation_substr | power_substation

threshold_low | 0.60
threshold_high | 0.90
threshold_critical | 0.95
threshold_warn | 0.75
threshold_emergency | 0.40
engine_target | 0.95
turbine_rated_eut | 9012
turbine_diff_mult | 2
ramp_speed_pct | 60
drain_override_eut | -4000
spike_clear_eut | 0
fill_enable_cooldown | 2
cooldown | 20
engine_cooldown | 2
engine_off_cooldown | 15
measure_interval | 5
boot_wait | 120
rotor_warn_pct | 20
engine_rated_eut | 32768
