# crystals.cfg - copy next to crystals.lua on the computer (optional if using bundled embed)
#
# monitor | <side or peripheral>     # 1-block monitor (default: left)
# buffer  | <peripheral name>        # MUST be on the same wired network as engravers
#                                    # (modem on the crate). Local sides like "top" cannot
#                                    # pushItems to modem machines. Prefer:
#                                    #   buffer | gtceu:tungstensteel_crate_0
#                                    # If omitted/side, script auto-picks a networked crate.
# machine | <peripheral name>        # optional; repeat; pins engravers (skips auto)
# machine_substr | <needle>          # auto engraver filter (default: laser_engraver)
# max_stack | <n>                    # per engraver input slot (default: 64)
# batch | <n>                        # recipe size; always even pushes (default: 2)
# poll | <seconds>                   # idle poll when nothing moved (default: 0.5)

monitor | left
# Prefer networked crate name. "top" is only OK if that inventory is on the modem net.
buffer | top
machine_substr | laser_engraver
max_stack | 64
batch | 2
poll | 0.5
