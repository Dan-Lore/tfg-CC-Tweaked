# crystals.cfg - copy next to crystals.lua on the computer
#
# monitor | <side or peripheral>     # 1-block monitor (default: left)
# buffer  | <peripheral name>        # main crate on the same wired network as engravers
# overflow | <peripheral name>       # extra crate; ONLY CC writes here (spill from main)
# keep_free | <n>                    # empty slots to keep in the main buffer (default: 8)
# machine | <peripheral name>        # optional; repeat; pins engravers (skips auto)
# machine_substr | <needle>          # auto engraver filter (default: laser_engraver)
# max_stack | <n>                    # per engraver input slot (default: 64)
# batch | <n>                        # recipe size; always even pushes (default: 2)
# poll | <seconds>                   # idle poll when nothing moved (default: 0.5)
# alias | <item_id> | <material> [| tier]
#   Treat a non-gtceu:*_gem item as a gem (default tier 3 = normal gem).
#   Built-in: diamond, emerald, lapis, quartz, amethyst, echo_shard, coal, AE2 certus/fluix.

monitor | left
buffer | top
overflow | gtceu:tungsten_steel_crate_1
keep_free | 8
machine_substr | laser_engraver
max_stack | 64
batch | 2
poll | 0.5
